<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Video Player</title>
</head>
<body>

<div id="video-app">
    <div>
        <label for="language-selector">Choose a language:</label>
        <select id="language-selector">
            <option value="">Loading languages...</option>
        </select>
    </div>
    
    <button id="upload-btn">+ Upload New Video</button>
    
    <hr>
    
    <iframe 
        id="video-frame" 
        width="640" 
        height="360" 
        src="" 
        allowfullscreen>
    </iframe>
</div>

<div id="upload-modal">
    <div>
        <span id="close-modal">&times; Close</span>
        <h2>Upload & Open Pull Request</h2>
        <form id="upload-form">
            
            <div>
                <label for="github-token">GitHub Token (Fine-grained):</label>
                <input type="password" id="github-token" placeholder="github_pat_xxxxxxxx..." required>
                <p>Requires Content Write Access and Pull Request Write Access limited to this single repository.</p>
            </div>

            <div>
                <label>1. Select Video File Asset:</label>
                <input type="file" id="primary-video-file" accept="video/mp4" required>
            </div>
            
            <div>
                <label>2. Language Tag (e.g., en, nl-NL, pt-PT, ru-Latn):</label>
                <input type="text" id="primary-lang-tag" placeholder="en-NL" required>
            </div>

            <div>
                <label>3. Video Title String:</label>
                <input type="text" id="primary-video-title" placeholder="Video Title" required>
            </div>

            <hr>

            <button type="submit" id="submit-btn">Submit Pull Request to GitHub</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- 1. SETUP DOM TARGET INTERFACE LOCATORS ---
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    const languageSelector = document.getElementById('language-selector');
    const videoFrame = document.getElementById('video-frame');

    const uploadBtn = document.getElementById('upload-btn');
    const uploadModal = document.getElementById('upload-modal');
    const closeModal = document.getElementById('close-modal');
    const uploadForm = document.getElementById('upload-form');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    const userLang = navigator.language.split('-')[0] || 'en'; 

    const langNamesTranslator = new Intl.DisplayNames([userLang], { type: 'language' });
    const regionNamesTranslator = new Intl.DisplayNames([userLang], { type: 'region' });

    // --- 2. AUTOMATED VIDEO PLAYER RENDER ---
    if (videoId) {
        const titleJsonPath = `./videos/${videoId}/translations/title.json`;
        const videoJsonPath = `./videos/${videoId}/translations/video.json`;

        let titlesData = {};
        let videosData = {};

        Promise.all([
            fetch(titleJsonPath).then(res => res.json()).catch(() => ({})),
            fetch(videoJsonPath).then(res => res.json()).catch(() => ({}))
        ]).then(([titles, videos]) => {
            titlesData = titles;
            videosData = videos;

            const availableLangs = Object.keys(videosData);

            if (availableLangs.length === 0) {
                languageSelector.innerHTML = '<option>No configurations found</option>';
                document.title = `Video: ${videoId}`;
                return;
            }

            const originalLangCode = availableLangs.find(lang => {
                const filename = videosData[lang].toLowerCase();
                const cleanLang = lang.toLowerCase().replace('-', '');
                return !filename.includes(cleanLang);
            }) || availableLangs[0];

            languageSelector.innerHTML = '';
            availableLangs.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;

                let formattedDropdownText = '';

                try {
                    let langCode = lang;
                    let regionCode = '';

                    if (lang.includes('-')) {
                        const parts = lang.split('-');
                        langCode = parts[0].toLowerCase();
                        regionCode = parts[1].toUpperCase();
                    } else {
                        const maximizedLocale = new Intl.Locale(lang).maximize();
                        if (maximizedLocale.region) {
                            regionCode = maximizedLocale.region.toUpperCase();
                        }
                    }

                    const baseLanguage = langNamesTranslator.of(langCode);
                    const countryName = regionCode ? regionNamesTranslator.of(regionCode) : '';
                    formattedDropdownText = countryName ? `${baseLanguage} (${countryName})` : baseLanguage;
                } catch (e) {
                    formattedDropdownText = lang.toUpperCase();
                }

                if (lang === originalLangCode) {
                    formattedDropdownText += ' (Original)';
                }

                option.textContent = formattedDropdownText;
                languageSelector.appendChild(option);
            });

            if (availableLangs.includes(userLang)) {
                languageSelector.value = userLang;
            } else if (availableLangs.includes(originalLangCode)) {
                languageSelector.value = originalLangCode;
            } else {
                languageSelector.value = availableLangs[0];
            }

            updatePlayer(languageSelector.value);
        });

        languageSelector.addEventListener('change', (e) => {
            updatePlayer(e.target.value);
        });

        function updatePlayer(lang) {
            const currentTitle = titlesData[lang] || `Video: ${videoId}`;
            const currentVideoFile = videosData[lang] || 'default.mp4';
            const fullVideoPath = `./videos/${videoId}/${currentVideoFile}`;

            document.title = currentTitle;

            const iframeHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; position: relative; }
                        video { width: 100%; height: 100%; object-fit: contain; }
                        .video-title { position: absolute; top: 12px; left: 12px; pointer-events: none; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 14px; z-index: 10; }
                    </style>
                </head>
                <body>
                    <div class="video-title">${currentTitle}</div>
                    <video id="player" controls autoplay>
                        <source src="${fullVideoPath}" type="video/mp4">
                    </video>
                </body>
                </html>
            `;
            videoFrame.srcdoc = iframeHTML;
        }
    } else {
        languageSelector.innerHTML = '<option>No active parameters located. Launch upload suite to test.</option>';
    }

    // --- 3. DYNAMIC INTERACTIVE MODAL COMPONENT ---
    uploadBtn.addEventListener('click', () => { statusDiv.style.display = "none"; uploadModal.style.display = 'block'; });
    closeModal.addEventListener('click', () => uploadModal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === uploadModal) uploadModal.style.display = 'none'; });

    // --- 4. GITHUB REPOSITORY PULL REQUEST GENERATOR ---
    const tokenInput = document.getElementById('github-token');
    if (localStorage.getItem('saved_github_token')) {
        tokenInput.value = localStorage.getItem('saved_github_token');
    }

    // Helper utility to read a file from the disk and convert it into a pure Base64 string payload
    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const base64String = reader.result.split(',')[1];
                resolve(base64String);
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const owner = "AeroHutch"; 
        const repo = "SOVPAVU";

        const token = tokenInput.value.trim();
        localStorage.setItem('saved_github_token', token);

        const primaryFile = document.getElementById('primary-video-file').files[0];
        const primaryLang = document.getElementById('primary-lang-tag').value.trim();
        const primaryTitle = document.getElementById('primary-video-title').value.trim();

        submitBtn.disabled = true;
        showStatus("Initializing request streams...", "orange");

        let randomNumericString = '';
        for (let i = 0; i < 8; i++) {
            randomNumericString += Math.floor(Math.random() * 10).toString();
        }
        
        const customBase64Id = btoa(randomNumericString).replace(/=/g, '');
        const cleanBranchName = `video-id-${customBase64Id}`;

        let videoJson = {};
        let titleJson = {};
        videoJson[primaryLang] = primaryFile.name;
        titleJson[primaryLang] = primaryTitle;

        const githubHeaders = {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
        };

        try {
            showStatus("Fetching baseline branch information...", "orange");
            const repoInfoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: githubHeaders });
            if (!repoInfoRes.ok) throw new Error("Could not fetch repository defaults. Double check your token repository access selection.");
            const repoData = await repoInfoRes.json();
            const defaultBranch = repoData.default_branch;

            const branchRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${defaultBranch}`, { headers: githubHeaders });
            if (!branchRefRes.ok) throw new Error(`Could not find latest commit on branch ${defaultBranch}`);
            const branchRefData = await branchRefRes.json();
            const latestCommitSha = branchRefData.object.sha;

            showStatus(`Creating isolated submission branch: ${cleanBranchName}...`, "orange");
            const createBranchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    ref: `refs/heads/${cleanBranchName}`,
                    sha: latestCommitSha
                })
            });
            if (!createBranchRes.ok) throw new Error("Branch creation rejected by GitHub API. Verify 'Contents: Read/Write' token scopes.");

            // Core repository commit payload sender
            async function commitRawPayloadToBranch(path, base64Payload, commitMsg) {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
                const response = await fetch(url, {
                    method: "PUT",
                    headers: githubHeaders,
                    body: JSON.stringify({
                        message: commitMsg,
                        content: base64Payload,
                        branch: cleanBranchName
                    })
                });
                return response;
            }

            // 1. Write the video.json file
            showStatus("Uploading configuration array [1/3]: video.json...", "orange");
            const videoJsonStr = JSON.stringify(videoJson, null, 2);
            const videoJsonBase64 = btoa(encodeURIComponent(videoJsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
            const res1 = await commitRawPayloadToBranch(`videos/${customBase64Id}/translations/video.json`, videoJsonBase64, `Add video registry for entry ${customBase64Id}`);
            if (!res1.ok) throw new Error(`Failed to write video configuration array (Status: ${res1.status})`);

            // 2. Write the title.json file
            showStatus("Uploading configuration array [2/3]: title.json...", "orange");
            const titleJsonStr = JSON.stringify(titleJson, null, 2);
            const titleJsonBase64 = btoa(encodeURIComponent(titleJsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
            const res2 = await commitRawPayloadToBranch(`videos/${customBase64Id}/translations/title.json`, titleJsonBase64, `Add title localization entry for ${customBase64Id}`);
            if (!res2.ok) throw new Error(`Failed to write title configuration array (Status: ${res2.status})`);

            // 3. Process and upload the raw binary MP4 file asset itself!
            showStatus("Processing large file binary data streams [3/3]...", "orange");
            const rawFileBase64 = await readFileAsBase64(primaryFile);
            
            showStatus(`Uploading raw video asset file: ${primaryFile.name} (This may take a minute)...`, "orange");
            const res3 = await commitRawPayloadToBranch(`videos/${customBase64Id}/${primaryFile.name}`, rawFileBase64, `Upload raw video media file asset for entry ${customBase64Id}`);
            if (!res3.ok) throw new Error(`Failed to upload MP4 video file asset to branch. Note: direct web uploads fail if size exceeds 25MB. (Status: ${res3.status})`);

            // 4. Open the Pull Request
            showStatus("Opening Pull Request sequence...", "orange");
            const prRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    title: `New Video Metadata Entry [ID: ${customBase64Id}]`,
                    head: cleanBranchName,
                    base: defaultBranch,
                    body: `Automated complete workflow upload setup completed for entry ID \`${customBase64Id}\`.\n\n**Included Elements:**\n- \`translations/video.json\`\n- \`translations/title.json\`\n- \`${primaryFile.name}\` (Raw Video Asset File)\n\nEverything has been pre-packaged automatically from the UI client.`
                })
            });

            if (prRes.ok) {
                const prData = await prRes.json();
                showStatus(`SUCCESS! Video and configurations have been uploaded successfully!<br><br><strong>Pull Request Link:</strong><br><a href="${prData.html_url}" target="_blank">${prData.html_url}</a><br><br><em>Action Needed: Just click the link above and merge the Pull Request! GitHub Pages will handle the rest.</em>`, "green");
                
                document.getElementById('primary-video-file').value = '';
                document.getElementById('primary-lang-tag').value = '';
                document.getElementById('primary-video-title').value = '';
                submitBtn.disabled = false;
            } else {
                const errData = await prRes.json().catch(() => ({}));
                throw new Error(errData.message || "Pull Request generation rejected. Verify 'Pull requests: Read/Write' token token scopes.");
            }

        } catch (err) {
            showStatus(`Execution Error: ${err.message}`, "red");
            submitBtn.disabled = false;
        }
    });

    function showStatus(msg, color) {
        statusDiv.style.display = "block";
        statusDiv.innerHTML = msg;
    }
});
</script>
</body>
</html>
