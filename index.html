<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Video Player</title>
<style>
    body { font-family: sans-serif; margin: 20px; }
    #upload-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); }
    #upload-modal > div { background: #fff; margin: 5% auto; padding: 20px; width: 500px; position: relative; border-radius: 8px; }
    #close-modal { cursor: pointer; position: absolute; top: 10px; right: 10px; font-weight: bold; }
    #status { margin-top: 10px; }
    iframe { border: none; }
</style>
</head>
<body>

<div id="video-app">
    <div>
        <label for="language-selector">Choose a language:</label>
        <select id="language-selector">
            <option value="">Loading languages...</option>
        </select>
    </div>
    
    <button id="upload-btn">+ Upload New Video</button>
    
    <hr>
    
    <iframe 
        id="video-frame" 
        width="640" 
        height="360" 
        src="" 
        allowfullscreen>
    </iframe>
</div>

<div id="upload-modal">
    <div>
        <span id="close-modal">&times; Close</span>
        <h2>Upload & Open Pull Request</h2>
        <form id="upload-form">
            
            <div>
                <label for="github-token">GitHub Token (Fine-grained):</label>
                <input type="password" id="github-token" placeholder="github_pat_xxxxxxxx..." required>
                <p>Requires Content Write Access and Pull Request Write Access limited to this single repository.</p>
            </div>

            <div>
                <label>1. Select Video File Asset:</label>
                <input type="file" id="primary-video-file" accept="video/mp4" required>
            </div>
            
            <div>
                <label>2. Language Tag (e.g., en, nl-NL, pt-PT, ru-Latn):</label>
                <input type="text" id="primary-lang-tag" placeholder="en-NL" required>
            </div>

            <div>
                <label>3. Video Title String:</label>
                <input type="text" id="primary-video-title" placeholder="Video Title" required>
            </div>

            <hr>

            <button type="submit" id="submit-btn">Submit Pull Request to GitHub</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    const languageSelector = document.getElementById('language-selector');
    const videoFrame = document.getElementById('video-frame');

    const uploadBtn = document.getElementById('upload-btn');
    const uploadModal = document.getElementById('upload-modal');
    const closeModal = document.getElementById('close-modal');
    const uploadForm = document.getElementById('upload-form');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    const userLang = (navigator.language || 'en').split('-')[0];

    let tracksArray = [];

    if (videoId) {
        const videoJsonPath = `./videos/${videoId}/translations/video.json`;

        fetch(videoJsonPath)
            .then(res => res.ok ? res.json() : {})
            .catch(() => ({}))
            .then(videoDataBody => {
                tracksArray = videoDataBody.dubbing || [];

                if (tracksArray.length === 0) {
                    languageSelector.innerHTML = '<option>No configurations found</option>';
                    document.title = `Video: ${videoId}`;
                    return;
                }

                const originalTarget = tracksArray.find(item => !item.automatic) || tracksArray[0];

                languageSelector.innerHTML = '';

                const autoOptions = [];
                const manualOptions = [];

                tracksArray.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.code;

                    let displayLabel = item.name;
                    if (item.code === originalTarget.code) {
                        displayLabel += ' (Original)';
                    }
                    option.textContent = displayLabel;

                    if (item.automatic === true) {
                        autoOptions.push(option);
                    } else {
                        manualOptions.push(option);
                    }
                });

                // --- MANUAL FIRST ---
                manualOptions.forEach(opt => languageSelector.appendChild(opt));

                if (autoOptions.length > 0 && manualOptions.length > 0) {
                    const divider = document.createElement('option');
                    divider.disabled = true;
                    divider.textContent = "──────────────";
                    languageSelector.appendChild(divider);
                }

                autoOptions.forEach(opt => languageSelector.appendChild(opt));

                const codeList = tracksArray.map(t => t.code);
                if (codeList.includes(userLang)) languageSelector.value = userLang;
                else if (originalTarget) languageSelector.value = originalTarget.code;
                else languageSelector.value = codeList[0];

                updatePlayer(languageSelector.value);
            });

        languageSelector.addEventListener('change', e => {
            if (!e.target.value) return;
            updatePlayer(e.target.value);
        });

        function updatePlayer(langCode) {
            const matchedTrack = tracksArray.find(t => t.code === langCode);
            const currentTitle = matchedTrack ? matchedTrack.name : `Video: ${videoId}`;
            const currentVideoFile = matchedTrack ? matchedTrack.file : 'default.mp4';
            const fullVideoPath = `./videos/${videoId}/${currentVideoFile}`;

            document.title = currentTitle;

            videoFrame.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin:0; background:#000; color:#fff; font-family:sans-serif; overflow:hidden; height:100vh; position:relative; }
                        video { width:100%; height:100%; object-fit:contain; }
                        .video-title { position:absolute; top:12px; left:12px; pointer-events:none; background: rgba(0,0,0,0.7); padding:6px 12px; border-radius:4px; font-size:14px; z-index:10; }
                    </style>
                </head>
                <body>
                    <div class="video-title">${currentTitle.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
                    <video id="player" controls autoplay>
                        <source src="${fullVideoPath}" type="video/mp4">
                    </video>
                </body>
                </html>
            `;
        }
    } else {
        languageSelector.innerHTML = '<option>No active parameters located. Launch upload suite to test.</option>';
    }

    // --- Modal ---
    uploadBtn.addEventListener('click', () => { statusDiv.style.display = "none"; uploadModal.style.display = 'block'; });
    closeModal.addEventListener('click', () => uploadModal.style.display = 'none');
    window.addEventListener('click', e => { if (e.target === uploadModal) uploadModal.style.display = 'none'; });

    // --- GitHub Upload ---
    const tokenInput = document.getElementById('github-token');
    if (localStorage.getItem('saved_github_token')) tokenInput.value = localStorage.getItem('saved_github_token');

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    uploadForm.addEventListener('submit', async e => {
        e.preventDefault();

        const owner = "AeroHutch"; 
        const repo = "SOVPAVU";

        const token = tokenInput.value.trim();
        localStorage.setItem('saved_github_token', token);

        const primaryFile = document.getElementById('primary-video-file').files[0];
        const primaryLang = document.getElementById('primary-lang-tag').value.trim();
        const primaryTitle = document.getElementById('primary-video-title').value.trim();
        const isAutomatic = document.getElementById('primary-automatic-status').value === "true";

        submitBtn.disabled = true;
        showStatus("Initializing request streams...", "orange");

        let randomNumericString = '';
        for (let i = 0; i < 8; i++) randomNumericString += Math.floor(Math.random() * 10);
                const customBase64Id = btoa(randomNumericString).replace(/=/g, '');
        const cleanBranchName = `video-id-${customBase64Id}`;

        const videoJson = {
            "dubbing": [
                {
                    "code": primaryLang,
                    "name": primaryTitle,
                    "file": primaryFile.name,
                    "automatic": isAutomatic
                }
            ]
        };

        const githubHeaders = {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
        };

        try {
            showStatus("Fetching repository info...", "orange");

            const repoInfoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: githubHeaders });
            if (!repoInfoRes.ok) throw new Error("Could not fetch repository info.");
            const repoData = await repoInfoRes.json();
            const defaultBranch = repoData.default_branch;

            const branchRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${defaultBranch}`, { headers: githubHeaders });
            if (!branchRefRes.ok) throw new Error("Could not fetch latest commit SHA.");
            const branchRefData = await branchRefRes.json();
            const latestCommitSha = branchRefData.object.sha;

            showStatus(`Creating branch: ${cleanBranchName}...`, "orange");
            const createBranchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    ref: `refs/heads/${cleanBranchName}`,
                    sha: latestCommitSha
                })
            });
            if (!createBranchRes.ok) throw new Error("Branch creation failed.");

            async function commitToBranch(path, base64Content, commitMsg) {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: githubHeaders,
                    body: JSON.stringify({
                        message: commitMsg,
                        content: base64Content,
                        branch: cleanBranchName
                    })
                });
                if (!res.ok) throw new Error(`Failed to commit file: ${path}`);
                return res;
            }

            // 1. Upload video.json
            showStatus("Uploading video.json...", "orange");
            const videoJsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(videoJson, null, 2))));
            await commitToBranch(`videos/${customBase64Id}/translations/video.json`, videoJsonBase64, `Create video configuration for ${customBase64Id}`);

            // 2. Upload video file
            showStatus(`Uploading video file: ${primaryFile.name}...`, "orange");
            const videoFileBase64 = await readFileAsBase64(primaryFile);
            await commitToBranch(`videos/${customBase64Id}/${primaryFile.name}`, videoFileBase64, `Upload video asset for ${customBase64Id}`);

            // 3. Open Pull Request
            showStatus("Opening Pull Request...", "orange");
            const prRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    title: `New Unified Video Entry [ID: ${customBase64Id}]`,
                    head: cleanBranchName,
                    base: defaultBranch,
                    body: `Automated upload for video entry ID \`${customBase64Id}\`.`
                })
            });

            if (!prRes.ok) throw new Error("Failed to create Pull Request.");

            const prData = await prRes.json();
            showStatus(`SUCCESS!<br><a href="${prData.html_url}" target="_blank">View Pull Request</a>`, "green");

            // Reset form
            uploadForm.reset();
            submitBtn.disabled = false;

        } catch (err) {
            showStatus(`Error: ${err.message}`, "red");
            submitBtn.disabled = false;
        }
    });

    function showStatus(msg, color="black") {
        statusDiv.style.display = "block";
        statusDiv.style.color = color;
        statusDiv.innerHTML = msg;
    }
});
</script>
</body>
</html>
