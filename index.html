<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Video Player</title>
<style>
    body { font-family: sans-serif; margin: 20px; }
    #upload-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 100; }
    #upload-modal > div { background: #fff; margin: 5% auto; padding: 20px; width: 500px; position: relative; border-radius: 8px; }
    #close-modal { cursor: pointer; position: absolute; top: 10px; right: 10px; font-weight: bold; }
    #status { margin-top: 10px; }
    iframe { border: none; }

    /* New UI Layout Block for Descriptions */
    #video-description-box {
        margin-top: 15px;
        padding: 15px;
        background: #f9f9f9;
        border-left: 4px solid #0076ff;
        max-width: 640px;
        box-sizing: border-box;
    }
    #video-description-box h3 { margin: 0 0 8px 0; font-size: 16px; }
    #video-description-box p { margin: 0; font-size: 14px; color: #444; line-height: 1.4; }

    /* Custom Dropdown Styling */
    .dropdown-container {
        display: inline-block;
        position: relative;
        vertical-align: middle;
        margin-left: 10px;
    }
    .dropdown-selected {
        display: flex;
        align-items: center;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        min-width: 200px;
        user-select: none;
    }
    .dropdown-selected::after {
        content: "";
        margin-left: auto;
        border: 5px solid transparent;
        border-top-color: #333;
        margin-top: 4px;
    }
    .dropdown-options {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid #ccc;
        border-top: none;
        border-radius: 0 0 4px 4px;
        max-height: 250px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .dropdown-options.show {
        display: block;
    }
    .dropdown-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        cursor: pointer;
    }
    .dropdown-item:hover {
        background-color: #f0f0f0;
    }
    .dropdown-divider {
        background-color: #eee;
        padding: 4px 12px;
        font-size: 11px;
        color: #777;
        font-weight: bold;
        text-transform: uppercase;
        pointer-events: none;
    }
    .flag-icon {
        width: 20px;
        height: 20px;
        object-fit: contain;
        margin-right: 8px;
    }
</style>
</head>
<body>

<div id="video-app">
    <div>
        <label>Choose a language:</label>
        <div class="dropdown-container" id="custom-language-dropdown">
            <div class="dropdown-selected" id="dropdown-trigger">Loading languages...</div>
            <div class="dropdown-options" id="dropdown-menu"></div>
        </div>
    </div>
    
    <button id="upload-btn" style="margin-top: 15px;">+ Upload New Video</button>
    
    <hr>
    
    <iframe 
        id="video-frame" 
        width="640" 
        height="360" 
        src="" 
        allowfullscreen>
    </iframe>

    <div id="video-description-box" style="display: none;">
        <h3 id="desc-title">Description</h3>
        <p id="desc-content"></p>
    </div>
</div>

<div id="upload-modal">
    <div>
        <span id="close-modal">&times; Close</span>
        <h2>Upload & Open Pull Request</h2>
        <form id="upload-form">
            
            <div>
                <label for="github-token">GitHub Token (Fine-grained):</label>
                <input type="password" id="github-token" placeholder="github_pat_xxxxxxxx..." required>
                <p>Requires Content Write Access and Pull Request Write Access limited to this single repository.</p>
            </div>

            <div>
                <label>1. Select Video File Asset:</label>
                <input type="file" id="primary-video-file" accept="video/mp4" required>
            </div>
            
            <div>
                <label>2. Language Tag (e.g., en, nl-NL, pt-PT, ru-Latn):</label>
                <input type="text" id="primary-lang-tag" placeholder="en-NL" required>
            </div>

            <div>
                <label>3. Video Title String:</label>
                <input type="text" id="primary-video-title" placeholder="Video Title" required>
            </div>

            <hr>

            <button type="submit" id="submit-btn">Submit Pull Request to GitHub</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    const dropdownTrigger = document.getElementById('dropdown-trigger');
    const dropdownMenu = document.getElementById('dropdown-menu');

    const videoFrame = document.getElementById('video-frame');
    
    // Description element references
    const descriptionBox = document.getElementById('video-description-box');
    const descContent = document.getElementById('desc-content');

    const uploadBtn = document.getElementById('upload-btn');
    const uploadModal = document.getElementById('upload-modal');
    const closeModal = document.getElementById('close-modal');
    const uploadForm = document.getElementById('upload-form');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    const userLang = (navigator.language || 'en').split('-')[0];

    let tracksArray = [];
    let activeSelectedCode = "";

    function getCountryCode(langCode) {
        if (!langCode) return 'US';
        if (langCode.includes('-')) {
            const parts = langCode.split('-');
            if (parts[1].length === 2) {
                return parts[1].toUpperCase();
            }
        }
        const baseMap = {
            'en': 'US', 'nl': 'NL', 'pt': 'PT', 'ru': 'RU', 'es': 'ES',
            'fr': 'FR', 'de': 'DE', 'it': 'IT', 'ja': 'JP', 'zh': 'CN', 'ko': 'KR'
        };
        const cleanBase = langCode.split('-')[0].toLowerCase();
        return baseMap[cleanBase] || 'US'; 
    }

    dropdownTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });

    window.addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
    });

    if (videoId) {
        const videoJsonPath = `./videos/${videoId}/translations/video.json`;

        fetch(videoJsonPath)
            .then(res => res.ok ? res.json() : {})
            .catch(() => ({}))
            .then(videoDataBody => {
                tracksArray = videoDataBody.dubbing || [];

                if (tracksArray.length === 0) {
                    dropdownTrigger.textContent = 'No configurations found';
                    document.title = `Video: ${videoId}`;
                    return;
                }

                const originalTarget = tracksArray.find(item => !item.automatic) || tracksArray[0];

                dropdownMenu.innerHTML = '';

                const autoOptions = [];
                const manualOptions = [];

                tracksArray.forEach(item => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'dropdown-item';
                    optionDiv.dataset.value = item.code;

                    const countryId = getCountryCode(item.code);
                    const flagImg = document.createElement('img');
                    flagImg.src = `https://flagsapi.com/${countryId}/shiny/64.png`;
                    flagImg.className = 'flag-icon';
                    flagImg.alt = countryId;

                    let displayLabel = item.code;
                    try {
                        const displayNameFormatter = new Intl.DisplayNames([item.code], { type: 'language' });
                        displayLabel = displayNameFormatter.of(item.code);
                        displayLabel = displayLabel.charAt(0).toUpperCase() + displayLabel.slice(1);
                    } catch (e) {
                        displayLabel = item.name;
                    }

                    if (item.code === originalTarget.code) {
                        displayLabel += ' (Original)';
                    }
                    
                    const textNode = document.createTextNode(displayLabel);
                    optionDiv.appendChild(flagImg);
                    optionDiv.appendChild(textNode);

                    optionDiv.addEventListener('click', () => {
                        selectDropdownItem(item.code, displayLabel, flagImg.src);
                    });

                    if (item.automatic === true) {
                        autoOptions.push(optionDiv);
                    } else {
                        manualOptions.push(optionDiv);
                    }
                });

                manualOptions.forEach(opt => dropdownMenu.appendChild(opt));

                if (autoOptions.length > 0 && manualOptions.length > 0) {
                    const divider = document.createElement('div');
                    divider.className = "dropdown-divider";
                    divider.textContent = "- Automatic -";
                    dropdownMenu.appendChild(divider);
                }

                autoOptions.forEach(opt => dropdownMenu.appendChild(opt));

                const codeList = tracksArray.map(t => t.code);
                let targetCode = codeList[0];
                
                if (codeList.includes(userLang)) targetCode = userLang;
                else if (originalTarget) targetCode = originalTarget.code;

                const matchedNode = Array.from(dropdownMenu.querySelectorAll('.dropdown-item')).find(el => el.dataset.value === targetCode);
                if (matchedNode) {
                    matchedNode.click();
                }
            });

        function selectDropdownItem(code, label, flagSrc) {
            activeSelectedCode = code;
            dropdownTrigger.innerHTML = `<img src="${flagSrc}" class="flag-icon" alt=""> ${label}`;
            dropdownMenu.classList.remove('show');
            updatePlayer(code);
        }

        function updatePlayer(langCode) {
            const matchedTrack = tracksArray.find(t => t.code === langCode);
            const currentTitle = matchedTrack ? matchedTrack.name : `Video: ${videoId}`;
            const currentVideoFile = matchedTrack ? matchedTrack.file : 'default.mp4';
            
            // Extract descriptions and subtitles fields conditionally from the track object
            const currentDescription = matchedTrack && matchedTrack.description ? matchedTrack.description : '';
            const currentSubtitles = matchedTrack && matchedTrack.subtitles ? matchedTrack.subtitles : '';

            const fullVideoPath = `./videos/${videoId}/${currentVideoFile}`;
            const fullSubtitlesPath = currentSubtitles ? `./videos/${videoId}/${currentSubtitles}` : '';

            document.title = currentTitle;

            // Render descriptive metadata blocks contextually below the application window
            if (currentDescription) {
                descContent.textContent = currentDescription;
                descriptionBox.style.display = "block";
            } else {
                descriptionBox.style.display = "none";
            }

            // Build native web text track definitions if subtitles are mapped
            let trackTag = '';
            if (fullSubtitlesPath) {
                trackTag = `<track src="${fullSubtitlesPath}" kind="subtitles" srclang="${langCode}" label="${langCode.toUpperCase()}" default>`;
            }

            videoFrame.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin:0; background:#000; color:#fff; font-family:sans-serif; overflow:hidden; height:100vh; position:relative; }
                        video { width:100%; height:100%; object-fit:contain; }
                        .video-title { position:absolute; top:12px; left:12px; pointer-events:none; background: rgba(0,0,0,0.7); padding:6px 12px; border-radius:4px; font-size:14px; z-index:10; }
                        video::cue { background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 16px; }
                    </style>
                </head>
                <body>
                    <div class="video-title">${currentTitle.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
                    <video id="player" controls autoplay>
                        <source src="${fullVideoPath}" type="video/mp4">
                        ${trackTag}
                    </video>
                </body>
                </html>
            `;
        }
    } else {
        dropdownTrigger.textContent = 'No active parameters located. Launch upload suite to test.';
    }

    // --- Modal ---
    uploadBtn.addEventListener('click', () => { statusDiv.style.display = "none"; uploadModal.style.display = 'block'; });
    closeModal.addEventListener('click', () => uploadModal.style.display = 'none');
    window.addEventListener('click', e => { if (e.target === uploadModal) uploadModal.style.display = 'none'; });

    // --- GitHub Upload (Completely Intact) ---
    const tokenInput = document.getElementById('github-token');
    if (localStorage.getItem('saved_github_token')) tokenInput.value = localStorage.getItem('saved_github_token');

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    uploadForm.addEventListener('submit', async e => {
        e.preventDefault();

        const owner = "AeroHutch"; 
        const repo = "SOVPAVU";

        const token = tokenInput.value.trim();
        localStorage.setItem('saved_github_token', token);

        const primaryFile = document.getElementById('primary-video-file').files[0];
        const primaryLang = document.getElementById('primary-lang-tag').value.trim();
        const primaryTitle = document.getElementById('primary-video-title').value.trim();
        
        const autoEl = document.getElementById('primary-automatic-status');
        const isAutomatic = autoEl ? autoEl.value === "true" : false;

        submitBtn.disabled = true;
        showStatus("Initializing request streams...", "orange");

        let randomNumericString = '';
        for (let i = 0; i < 8; i++) randomNumericString += Math.floor(Math.random() * 10);
        const customBase64Id = btoa(randomNumericString).replace(/=/g, '');
        const cleanBranchName = `video-id-${customBase64Id}`;

        const videoJson = {
            "dubbing": [
                {
                    "code": primaryLang,
                    "name": primaryTitle,
                    "file": primaryFile.name,
                    "automatic": isAutomatic
                }
            ]
        };

        const githubHeaders = {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
        };

        try {
            showStatus("Fetching repository info...", "orange");

            const repoInfoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: githubHeaders });
            if (!repoInfoRes.ok) throw new Error("Could not fetch repository info.");
            const repoData = await repoInfoRes.json();
            const defaultBranch = repoData.default_branch;

            const branchRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${defaultBranch}`, { headers: githubHeaders });
            if (!branchRefRes.ok) throw new Error("Could not fetch latest commit SHA.");
            const branchRefData = await branchRefRes.json();
            const latestCommitSha = branchRefData.object.sha;

            showStatus(`Creating branch: ${cleanBranchName}...`, "orange");
            const createBranchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    ref: `refs/heads/${cleanBranchName}`,
                    sha: latestCommitSha
                })
            });
            if (!createBranchRes.ok) throw new Error("Branch creation failed.");

            async function commitToBranch(path, base64Content, commitMsg) {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: githubHeaders,
                    body: JSON.stringify({
                        message: commitMsg,
                        content: base64Content,
                        branch: cleanBranchName
                    })
                });
                if (!res.ok) throw new Error(`Failed to commit file: ${path}`);
                return res;
            }

            showStatus("Uploading video.json...", "orange");
            const videoJsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(videoJson, null, 2))));
            await commitToBranch(`videos/${customBase64Id}/translations/video.json`, videoJsonBase64, `Create video configuration for ${customBase64Id}`);

            showStatus(`Uploading video file: ${primaryFile.name}...`, "orange");
            const videoFileBase64 = await readFileAsBase64(primaryFile);
            await commitToBranch(`videos/${customBase64Id}/${primaryFile.name}`, videoFileBase64, `Upload video asset for ${customBase64Id}`);

            showStatus("Opening Pull Request...", "orange");
            const prRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                    title: `New Unified Video Entry [ID: ${customBase64Id}]`,
                    head: cleanBranchName,
                    base: defaultBranch,
                    body: `Automated upload for video entry ID \`${customBase64Id}\`.`
                })
            });

            if (!prRes.ok) throw new Error("Failed to create Pull Request.");

            const prData = await prRes.json();
            showStatus(`SUCCESS!<br><a href="${prData.html_url}" target="_blank">View Pull Request</a>`, "green");

            uploadForm.reset();
            submitBtn.disabled = false;

        } catch (err) {
            showStatus(`Error: ${err.message}`, "red");
            submitBtn.disabled = false;
        }
    });

    function showStatus(msg, color="black") {
        statusDiv.style.display = "block";
        statusDiv.style.color = color;
        statusDiv.innerHTML = msg;
    }
});
</script>
</body>
</html>
