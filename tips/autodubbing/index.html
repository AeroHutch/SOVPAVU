<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supported Dubbing Languages</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px auto;
            max-width: 600px;
            line-height: 1.6;
            padding: 0 20px;
        }
        h1 {
            font-size: 24px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .subtitle {
            color: #555;
            font-style: italic;
            margin-bottom: 25px;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background-color: #f9f9f9;
            border-left: 4px solid #333;
            border-radius: 0 4px 4px 0;
        }
        .lang-code {
            font-family: monospace;
            background: #eee;
            padding: 2px 6px;
            border-radius: 3px;
            float: right;
            font-size: 13px;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Automated Dubbing Target Languages</h1>
    <p class="subtitle">The following languages are configured for automated translation and voice generation from an English source video:</p>

    <ul id="language-list">
        <li class="loading">Loading configurations from JSON dataset...</li>
    </ul>

    <a href="index.html" class="back-link">&larr; Return to Video Player</a>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const listContainer = document.getElementById('language-list');

            // Fetches data directly from your local languages.json file array structure
            fetch('./languages.json')
                .then(response => {
                    if (!response.ok) throw new Error("JSON file link unavailable.");
                    return response.json();
                })
                .then(data => {
                    listContainer.innerHTML = ''; // Clear out loading state
                    
                    const targets = data.automated_dubbing_targets || [];
                    
                    targets.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = `${item.name} <span class="lang-code">${item.code}</span>`;
                        listContainer.appendChild(li);
                    });
                })
                .catch(err => {
                    listContainer.innerHTML = `<li style="border-left-color: red; color: red;">Error: Unable to render languages list (${err.message})</li>`;
                });
        });
    </script>
</body>
</html>
